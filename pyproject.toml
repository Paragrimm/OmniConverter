[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "omniconverter"
dynamic = ["version"]
description = "One simple, privacy-aware converter for video, audio, images, 3D models, documents and data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Paragrimm" }]
keywords = ["converter", "ffmpeg", "pandoc", "libreoffice", "gui", "privacy", "qr-code",
            "normal-map", "noise", "3d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "PySide6-Essentials>=6.6",
    "Pillow>=11.3",
    "pillow-heif>=0.18",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
    "platformdirs>=4.0",
    "numpy>=1.26",
    "trimesh>=4.5",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]
build = ["pyinstaller>=6.6"]

[project.scripts]
omniconvert = "omniconverter.cli:main"

[project.gui-scripts]
omniconverter = "omniconverter.gui.app:main"

[tool.hatch.version]
path = "src/omniconverter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/omniconverter"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # German typography (– „“) in UI strings is intended

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ffmpeg: needs ffmpeg/ffprobe installed",
    "pandoc: needs pandoc installed",
    "libreoffice: needs LibreOffice (soffice) installed",
    "blender: needs Blender installed",
    "gui: needs a Qt platform (offscreen is fine)",
]

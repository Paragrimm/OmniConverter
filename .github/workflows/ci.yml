name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install converters and Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pandoc \
            libreoffice-writer libreoffice-calc \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install converters (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg pandoc --no-progress -y

      - name: Install OmniConverter
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Show detected tools
        run: omniconvert --tools

      - name: Test
        run: python -m pytest -v

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[build]"

      - name: Build with PyInstaller
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: OmniConverter-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
